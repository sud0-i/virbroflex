name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk vibro-trigger.apk

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: vibro-trigger-apk
          path: vibro-trigger.apk

      - name: Выложить в Releases (удобно качать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: vibro-trigger.apk
          make_latest: true
